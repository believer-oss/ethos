<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Apply the saved theme before first paint. Keep in sync with src/lib/theme.ts.
			(function () {
				var palettes = [
					'ayu',
					'catppuccin',
					'gruvbox',
					'hacker',
					'nord',
					'solarized',
					'synthwave',
					'tokyonight'
				];
				var theme = 'dark';
				try {
					var stored = localStorage.getItem('color-theme');
					if (stored === 'light' || palettes.indexOf(stored) !== -1) theme = stored;
				} catch (e) {}
				var root = document.documentElement;
				root.classList.toggle('dark', theme !== 'light');
				if (palettes.indexOf(theme) !== -1) root.classList.add(theme);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
