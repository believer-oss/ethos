[package]
name = "fleet-api"
version = "0.2.0"
edition = "2021"
description = "Kubernetes custom resources for fleet management: ShardConfig, Shard, Promotion, FleetRelease and LocalFleetRelease."
publish = false

[features]
# Picks a Kubernetes version for k8s-openapi so the crdgen binary can build on its own.
# Library consumers must not enable it: the k8s-openapi version is the final binary's choice.
crdgen = ["k8s-openapi/v1_32"]

[[bin]]
name = "crdgen"
required-features = ["crdgen"]

[dependencies]
kube = { version = "4.2.0", default-features = false, features = ["derive"] }
# No version feature here: k8s-openapi requires library crates to leave that to the binary.
k8s-openapi = { version = "0.28.0", default-features = false, features = ["std", "schemars"] }
schemars = "1.2.3"
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = "0.11"
thiserror = "2"

[dev-dependencies]
# Keep this version feature equal to the `crdgen` feature above and to core's k8s-openapi feature:
# k8s-openapi refuses to build with two version features enabled in one build.
k8s-openapi = { version = "0.28.0", features = ["v1_32"] }
# `cel` evaluates the CRDs' validation rules locally, so the tests can exercise them without an apiserver.
kube = { version = "4.2.0", default-features = false, features = ["derive", "cel"] }
